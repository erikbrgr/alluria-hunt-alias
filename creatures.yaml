- name: Drowned Ascetic
  challengeRating: 3
  experiencePoints: 700
  environment: ''
  flavor: 'Dressed in tattered robes, its fists wrapped in long ribbons of rotting
    cloth, the drowned ascetic moves with alarming speed for an undead creature. This
    martial artist, rising from the ocean in Tammeraut’s Fate, retains its fighting
    reflexes despite its rotting flesh.


    BLUEROT


    This disease target humanoids. While afflicted with bluerot, a victim grows grotesque
    blue boils on their face and back. This disease is carried by undead (including
    the drowned ones in Tammeraut’s Fate), and victims most often acquire it through
    wounds caused by infected creatures.


    The disease’s boils manifest in 1d4 hours, causing the victim’s Constitution and
    Charisma scores to decrease by 1d4 each, to a minimum of 3. This is quickly followed
    by a fever and tingling in the extremities. An infected creature is vulnerable
    to radiant damage and gains the ability to breathe underwater.


    At the end of each long rest, an infected creature makes a DC 12 Constitution
    saving throw. On a success, the victim regains 1 point of Constitution and 1 point
    of Charisma lost to the disease. If the infected creature regains all the points
    lost to the disease, it is cured. Other effects that raise the victim’s ability
    scores do not cure the disease. On a failed saving throw, the victim takes 18
    (4d8) necrotic damage as the boils burst and spread. A creature reduced to 0 hit
    points by this damage cannot regain hit points until the disease is cured, though
    it can be stabilized as normal.'
