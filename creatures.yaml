- name: Elder Brain
  challengeRating: 14
  experiencePoints: 11500
  environment: ''
  flavor: "<b>Lair Actions:</b>\nWhen fighting inside its lair, an elder brain can\
    \ use lair actions. On initiative count 20 (losing initiative ties), an elder\
    \ brain can take one lair action to cause one of the following effects; the elder\
    \ brain can't use the same lair action two rounds in a row:\n• The elder brain\
    \ casts <i>wall of force</i>.\n• The elder brain targets one friendly creature\
    \ it can sense within 120 feet of it. The target has a flash of inspiration and\
    \ gains advantage on one attack roll, ability check, or saving throw it makes\
    \ before the end of its next turn. If the target doesn't or can't use this benefit\
    \ in that time, the inspiration is lost.\n• The elder brain targets one creature\
    \ it can sense within 120 feet of it and anchors it by sheer force of will. The\
    \ target must succeed on a DC 18 Charisma saving throw or be unable to leave its\
    \ current space. It can repeat the saving throw at the end of each of its turns,\
    \ ending the effect on itself on a success. \n<b>Regional Effects:</b>\nThe territory\
    \ within 5 miles of an elder brain is altered by the creature's psionic presence,\
    \ which creates one or more of the following effects:\n• Creatures within 5 miles\
    \ of an elder brain feel as if they are being followed, even when they are not.\n\
    • The elder brain can overhear any telepathic conversation happening within 5\
    \ miles of it. The creature that initiated the telepathic conversation makes a\
    \ DC 18 Wisdom (Insight) check when telepathic contact is first established. If\
    \ the check succeeds, the creature is aware that something is eavesdropping on\
    \ the conversation. The nature of the eavesdropper isn't revealed,\nand the elder\
    \ brain can't participate in the telepathic conversation unless it has formed\
    \ a psychic link with the creature that initiated it.\n• Any creature with which\
    \ the elder brain has formed a psychic link hears faint, incomprehensible whispers\
    \ in the deepest recesses of its mind. This psychic detritus consists of the elder\
    \ brain's stray thoughts commingled with those of other creatures to which it\
    \ is linked.\nIf the elder brain dies, these effects immediately end."
