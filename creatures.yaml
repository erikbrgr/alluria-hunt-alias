  experiencePoints: 20000
  environment: ''
  flavor: "<b>Lair Actions:</b>\nOn initiative count 20 (losing initiative ties),\
    \ the dragon takes a lair action to cause one of the following effects; the dragon\
    \ can't use the same effect two rounds in a row: \n• Part of the ceiling collapses\
    \ above one creature that the dragon can see within 120 feet of it. The creature\
    \ must succeed on a DC 15 Dexterity saving throw or take 10 (3d6) bludgeoning\
    \ damage and be knocked prone and buried. The buried target is restrained and\
    \ to breathe or stand up. A creature can take an action to make a DC 10 Strength\
    \ check, ending the buried state on a success.\n• A cloud of sand swirls about\
    \ in a 20-foot-radius sphere centered on a point the dragon can see within 120\
    \ feet of it. The cloud spreads around corners. Each creature in the cloud must\
    \ succeed on a DC 15 Constitution saving throw or be blinded for 1 minute. A creature\
    \ can repeat the saving throw at the end of each of its turns, ending the effect\
    \ on itself on a success.\n• Lightning arcs, forming a 5-foot-wide line between\
    \ two of the lair's solid surfaces that the dragon can see. They must be within\
    \ 120 feet of the dragon and 120 feet of each other. Each creature in that line\
    \ must succeed on a DC 15 Dexterity saving throw or take 10 (3d6) lightning damage.\n\
    <b>Regional Effects:</b>\nThe region containing a legendary blue dragon's lair\
    \ is warped by the dragon's magic, which creates one or more of the following\
    \ effects:\n• Thunderstorms rage within 6 miles of the lair.\n• Dust devils scour\
    \ the land within 6 miles of the lair. A dust devil has the statistics of an air\
    \ elemental, but it can't fly, has a speed of 50 feet, and has an Intelligence\
    \ and Charisma of 1 (- 5).\n• Hidden sinkholes form in and around the dragon's\
    \ lair. A sinkhole can be spotted from a safe distance with a successful DC 20\
    \ Wisdom (Perception) check. Otherwise, the first creature to step on the thin\
    \ crust covering the sinkhole must succeed on a DC 15 Dexterity saving throw or\
    \ fall 1d6 x 10 feet into the sinkhole.\nIf the dragon dies, the dust devils disappear\
    \ immediately, and the thunderstorms abate within 1d10 days. Any sinkholes remain\
    \ where they are."
