  flavor: "<b>Lair Actions:</b>\nOn initiative count 20 (losing initiative ties),\
    \ the hag can take a lair action to cause one of the following effects, but can't\
    \ use the same effect two rounds in a row:\n• Until initiative count 20 on the\
    \ next round, the hag can pass through solid walls, doors, ceilings, and floors\
    \ as if the surfaces weren't there.\n• The hag targets any number of doors and\
    \ windows that she can see, causing each one to either open or close as she wishes.\
    \ Closed doors can be magically locked (requiring a successful DC 20 Strength\
    \ check to force open) until she chooses to make them unlocked, or until she uses\
    \ this lair action again to open them. \n• The hag creates a thick cloud of caustic\
    \ black smoke that fills a 20-foot-radius sphere centered on a point she can see\
    \ within 120 feet her. The cloud lasts until initiative count 20 on the next round.\
    \ Creatures and objects in or behind the smoke are heavily obscured. A creature\
    \ that enters the cloud for the first time on a turn or starts its turn there\
    \ takes 10 (3d6) acid damage. \n<b>Regional Effects:</b>\nThe region within 1\
    \ mile of a grandmother hag's lair is warped by the creature's fell magic, which\
    \ creates one or more of the following effects:\n• Birds, rodents, snakes, spiders,\
    \ or toads (or some other creatures appropriate to the hag) are found in great\
    \ profusion.\n• Beasts that have an Intelligence score of 2 or lower are charmed\
    \ by the hag and directed to be aggressive toward intruders in the area.\n• Strange\
    \ carved figurines, twig fetishes, or rag dolls magically appear in trees.\n•\
    \ The gravel stones on a safe-looking path, road, or trails occasionally become\
    \ sharp for 100-foot intervals. Walking on these areas is like walking on caltrops.\n\
    • Small avalanches of rock intermittently fall, blocking a path or burying intruders.\
    \ A buried creature is restrained and has to hold its breath until it is dug out.\n\
    • Strange laughter, sounding like that of children or the hag herself, occasionally\
    \ pierces the silence.\n• Small cairns appear along the route of travelers, containing\
    \ anything from mysterious bones to nothing at all. These cairns might be haunted\
    \ by skeletons, specters, or hostile fey."
