    \ Closed doors can be magically locked (requiring a successful DC 20 Strength\
    \ check to force open) until she chooses to make them unlocked, or until she uses\
    \ this lair action again to open them. \n• The hag creates an illusory duplicate\
    \ of herself, which appears in its own space. As long as she can see her duplicate,\
    \ the hag can move it a distance equal to her walking speed as well as make the\
    \ illusion speak on her turn (no action required). The illusion has the same statistics\
    \ as the hag but can't take actions or reactions. It can interact with its environment\
    \ and even pick up and hold real objects. The illusion seems real in every way\
    \ but disappears if it takes any amount of damage. Otherwise, it lasts until the\
    \ hag dismisses it (no action required) or can no longer see it. If the hag uses\
    \ this lair action to create a new duplicate, the previous one vanishes, dropping\
    \ any real objects in its possession.\n<b>Regional Effects:</b>\nThe region within\
    \ 1 mile of a grandmother hag's lair is warped by the creature's fell magic, which\
    \ creates one or more of the following effects:\n• Birds, rodents, snakes, spiders,\
    \ or toads (or some other creatures appropriate to the hag) are found in great\
    \ profusion.\n• Beasts that have an Intelligence score of 2 or lower are charmed\
    \ by the hag and directed to be aggressive toward intruders in the area.\n• Strange\
    \ carved figurines, twig fetishes, or rag dolls magically appear in trees.\n•\
    \ Illusory duplicates of the hag appear in random places at random times (but\
    \ never more than one in any given location). An illusory duplicate has no substance,\
    \ but it looks, sounds, and moves like the hag. The hag can sense when one or\
    \ more creatures are within 60 feet of her duplicate and can interact with them\
    \ as if she were present and standing in the duplicate's space. If the illusory\
    \ duplicate takes any damage, it disappears.\n• The region takes twice as long\
    \ as normal to traverse, since the plants grow thick and twisted, and the swamps\
    \ are thick with reeking mud.\n• Trees transform into awakened trees and attack\
    \ when hostile intruders are near."
