  flavor: "A beholder encountered in its lair has a challenge rating of 14 (11,500\
    \ XP). \n<b>Lair Actions:</b>\nWhen fighting inside its lair, a beholder can invoke\
    \ the ambient magic to take lair actions. On initiative count 20 (losing initiative\
    \ ties), the beholder can take one lair action to cause one of the following effects:\n\
    • A 50-foot square area of ground within 120 feet of the beholder becomes slimy;\
    \ that area is difficult terrain until initiative count 20 on the next round.\n\
    • Walls within 120 feet of the beholder sprout grasping appendages until initiative\
    \ count 20 on the round after next. Each creature of the beholder's choice that\
    \ starts its turn within 10 feet of such a wall must succeed on a DC 15 Dexterity\
    \ saving throw or be grappled. Escaping requires a successful DC 15 Strength (Athletics)\
    \ or Dexterity (Acrobatics) check.\n• An eye opens on a solid surface within 60\
    \ feet of the beholder. One random eye ray of the beholder shoots from that eye\
    \ at a target of the beholder's choice that it can see. The eye then closes and\
    \ disappears.\nThe beholder can't repeat an effect until they have all been used,\
    \ and it can't use the same effect two rounds in a row.\n<b>Regional Effects:</b>\n\
    A region containing a beholder's lair is warped by the creature's'unnatural presence,\
    \ which creates one or more of the following effects:\n• Creatures within 1 mile\
    \ of the beholder's lair sometimes feel as if they're being watched when they\
    \ aren't.\n• When the beholder sleeps, minor warps in reality occur within 1 mile\
    \ of its lair and then vanish 24 hours later. Marks on cave walls might change\
    \ subtly, an eerie trinket might appear where none existed before, harmless slime\
    \ might coat a statue, and so on. These effects apply only to natural surfaces\
    \ and to nonmagical objects that aren't on anyone's person.\nIf the beholder dies,\
    \ these effects fade over the course of 1d10 days."
